# 可迁移的归档工作区路径配置。
# 相对路径先以本文件所在目录解析 project_root，再以 project_root 解析其余路径。
paths:
  project_root: "../.."

  # Profile 目录（software + vulnerability）
  profile_base_path: "profiles"
  
  # 数据目录
  data_base_path: "data"
  vuln_data_path: "data/vuln.json"
  repo_base_path: "data/repos"
  
  # CodeQL 数据库目录
  codeql_db_path: "codeql_dbs"

  embedding_model_path: "models"
